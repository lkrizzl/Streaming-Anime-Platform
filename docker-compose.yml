services:
  webapi:
    image: ${DOCKER_REGISTRY-}sreaming-api
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      streaming.database:
        condition: service_healthy

  streaming.database:
    image: postgres:18
    container_name: streaming.database
    volumes:
      - streaming-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  streaming-db-data: